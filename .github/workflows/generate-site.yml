name: Generate Site

on: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  generate-site:
    permissions:
      contents: write  # for Git to git push
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
        token: ${{ secrets.PUSH_TOKEN }}
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.13
    - name: Install Poetry
      run: curl -sSL https://install.python-poetry.org | python -
    - name: Install dependencies with Poetry
      run: poetry install
    - name: Run Site Generation 
      run: poetry run python bin/site.py -v
    - name: Run Site Generation 
      run: poetry run python bin/gen-files.py
    - name: Commit Generated Data
      run: |
          git config --global user.name "Github Actions"
          git config --global user.email "robot@noreply.github.com"
          git config --global push.default simple
          git add .
          git commit -m "New site and hashes generated by GitHub Actions [ci skip]"
          git pull --rebase origin main
          git push
